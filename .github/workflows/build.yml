name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LoadRings.app
        working-directory: macos
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION=0.0.0-dev
          VERSION="$VERSION" ./scripts/build-app.sh
          ditto -c -k --keepParent build/LoadRings.app ../LoadRings-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LoadRings-macOS
          path: LoadRings-macOS.zip

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish windows/LoadRings/LoadRings.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Rename
        shell: bash
        run: mv out/LoadRings.exe LoadRings-${{ matrix.rid }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LoadRings-${{ matrix.rid }}
          path: LoadRings-${{ matrix.rid }}.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LoadRings-* --repo "$GITHUB_REPOSITORY" --generate-notes
